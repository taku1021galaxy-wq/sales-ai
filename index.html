<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="営業AI"><link rel="manifest" href="manifest.webmanifest">
<title>営業AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}main{padding:16px 16px 90px;max-width:720px;margin:auto}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;background:#f9fafb;border-radius:12px}.stat b{font-size:24px;display:block}button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#111827;color:#fff}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:100px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.muted{color:#6b7280;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e5e7eb;font-size:12px}
.ai{background:#eef2ff;border:1px solid #c7d2fe}.company{cursor:pointer}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;color:#6b7280;padding:7px 10px;font-size:12px}nav button.active{color:#111827}h2{font-size:18px}
</style></head><body><header><h1>営業AI</h1><small>営業管理・AIアシスタント</small></header><main id="app"></main>
<nav><button data-p="home">🏠<br>ホーム</button><button data-p="companies">🏢<br>企業</button><button data-p="add">➕<br>登録</button><button data-p="ai">🤖<br>AI</button></nav>
<script>
const KEY="sales_ai_companies_v1";let data=JSON.parse(localStorage.getItem(KEY)||"[]"),page="home";
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function go(p){page=p;render()}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p==page));({home,companies,add,ai}[page])()}
function home(){let t=new Date().toISOString().slice(0,10),d=data.filter(x=>x.next&&x.next<=t);$("app").innerHTML=`<h2>今日の営業状況</h2><div class="grid"><div class="stat">登録企業<b>${data.length}</b></div><div class="stat">要フォロー<b>${d.length}</b></div><div class="stat">A見込み<b>${data.filter(x=>x.level=="A").length}</b></div><div class="stat">B見込み<b>${data.filter(x=>x.level=="B").length}</b></div></div><div class="card ai"><h3>🤖 営業AI</h3><p>会社情報・営業メモから次回の質問や提案を整理。</p><button onclick="go('ai')">AIに相談する</button></div><div class="card"><h3>📅 要フォロー</h3>${d.length?d.map(x=>`<p>• ${esc(x.name)}　<span class="badge">${x.next}</span></p>`).join(""):"<p class=muted>現在ありません。</p>"}</div>`}
function companies(){ $("app").innerHTML=`<div class=row><h2>企業一覧</h2><button onclick="go('add')">＋登録</button></div><input id=q placeholder="会社名・担当者で検索" oninput="list()"><div id=list></div>`;list()}
function list(){let q=($("q")?.value||"").toLowerCase(),a=data.filter(x=>(x.name+" "+x.person).toLowerCase().includes(q));$("list").innerHTML=a.length?a.map(x=>`<div class="card company" onclick="edit('${x.id}')"><div class=row><b>${esc(x.name)}</b><span class=badge>${esc(x.level||"-")}</span></div><p class=muted>${esc(x.area||"")} ${x.person?"・"+esc(x.person):""}</p><p>${esc(x.memo||"メモなし")}</p>${x.next?`<span class=badge>次回 ${x.next}</span>`:""}</div>`).join(""):"<div class=card>企業がありません。</div>"}
function add(x={}){$("app").innerHTML=`<h2>${x.id?"企業を編集":"企業を登録"}</h2><div class=card>
<label>会社名 *</label><input id=name value="${esc(x.name)}"><label>エリア</label><input id=area value="${esc(x.area)}"><label>担当者</label><input id=person value="${esc(x.person)}"><label>従業員数</label><input id=emp type=number value="${esc(x.emp)}"><label>現在のウォーターサーバー</label><input id=water value="${esc(x.water)}"><label>現在のコーヒー環境</label><input id=coffee value="${esc(x.coffee)}"><label>見込み度</label><select id=level>${["A","B","C","保留"].map(v=>`<option ${x.level==v?"selected":""}>${v}</option>`).join("")}</select><label>次回訪問日</label><input id=next type=date value="${esc(x.next)}"><label>営業メモ</label><textarea id=memo>${esc(x.memo)}</textarea><div class=row style="margin-top:14px"><button onclick="saveCompany('${x.id||""}')">保存</button>${x.id?`<button class=danger onclick="del('${x.id}')">削除</button>`:""}</div></div>`}
function saveCompany(id){let x={name:name.value.trim(),area:area.value.trim(),person:person.value.trim(),emp:emp.value,water:water.value.trim(),coffee:coffee.value.trim(),level:level.value,next:next.value,memo:memo.value.trim()};if(!x.name)return alert("会社名を入力してください");if(id){let i=data.findIndex(v=>v.id==id);data[i]={...data[i],...x}}else data.push({id:Date.now().toString(),...x});save();go("companies")}
function edit(id){let x=data.find(v=>v.id==id);if(x)add(x)}function del(id){if(confirm("削除しますか？")){data=data.filter(x=>x.id!=id);save();go("companies")}}
function ai(){ $("app").innerHTML=`<h2>🤖 AI営業アシスタント</h2><div class=card><label>企業</label><select id=ac><option value="">選択してください</option>${data.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>相談内容</label><textarea id=prompt placeholder="例：この会社をどう攻めればいい？"></textarea><button onclick=analyze()>分析する</button></div><div id=result></div>`}
function analyze(){let x=data.find(v=>v.id==ac.value);if(!x){result.innerHTML="<div class=card>企業を選択してください。</div>";return}let qs=[];if(!x.emp)qs.push("従業員数・利用人数");if(!x.water)qs.push("現在の水の業者・月間使用本数・料金");if(!x.coffee)qs.push("コーヒー環境・機器・業者");qs.push("現在の業者で助かっている点／困っている点","決裁者・契約更新時期・予算");result.innerHTML=`<div class="card ai"><h3>🎯 次回の攻略</h3><p>${x.water?"現在の水環境と料金を比較し、5G/3Gの適合を判断":"まず水の利用状況を聞き、使用量に応じて5G/3Gを比較"}。無理に切替を迫らず、現状との比較材料を集める。</p><h3>🔎 次回聞くこと</h3><ol>${qs.map(q=>`<li>${q}</li>`).join("")}</ol><h3>💬 想定される断り</h3><p>「今の業者で困っていない」</p><p><b>返し：</b>「ありがとうございます。ちなみに、今の業者さんで一番助かっているところってどこですか？」</p><p class=muted>現在は営業ルールによる試作AIです。公開版では生成AI APIを接続できます。</p></div>`}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
